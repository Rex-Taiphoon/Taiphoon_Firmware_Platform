name: Build frontend assets
on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: Validate the public frontend build for the separate Pages repository
        required: true
        default: false
        type: boolean
permissions: {}
jobs:
  build:
    if: inputs.confirmed
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: ${{ vars.PLATFORM_API_URL }}
          PAGES_BASE_PATH: /Taiphoon_Firmware_Pages/
      - run: node scripts/audit-public.mjs
